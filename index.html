<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <title>NOT YOUR BUSINESS.</title>
  <meta name="description" content="Character assessment in progress." />
  <meta name="nyb-build" content="2026-09-24-romantic-v3" />
  <script src="./analytics.js"></script>
  <!-- Canonical live build: GitHub Pages. Vercel redirect intentionally disabled to avoid version drift. -->
  <style>
    :root {
      --bg:#050505;
      --surface:#0b0b0b;
      --surface-2:#11110f;
      --text:#f4f4f2;
      --muted:#8f8f8a;
      --dim:#575752;
      --line:#252522;
      --line-strong:#3c3c37;
      --accent:#39ff14;
      --danger:#ff564d;
      --max:600px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;background:var(--bg)}
    body{
      margin:0;min-height:100svh;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
    }
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .shell{
      min-height:100svh;width:min(100%,var(--max));margin:0 auto;
      padding:max(22px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
      display:grid;grid-template-rows:auto 1fr auto;gap:14px;
    }
    .topbar{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .back,.sfx{
      appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 0;cursor:pointer;
      font-size:13px;letter-spacing:.01em;transition:color .16s ease,opacity .16s ease;
    }
    .back{opacity:0;pointer-events:none}.back.visible{opacity:1;pointer-events:auto}.back:hover,.back:focus-visible,.sfx:hover,.sfx:focus-visible{color:var(--text);outline:none}
    .hud{display:flex;align-items:center;gap:14px}.step{color:#5d5d58;font-size:11px;letter-spacing:.14em;font-variant-numeric:tabular-nums}.sfx{min-width:34px;text-align:right}.sfx.off{color:#44443f;text-decoration:line-through}
    main{display:flex;align-items:center;padding:28px 0 48px;min-width:0}
    .panel{width:100%;animation:enter .26s cubic-bezier(.2,.75,.25,1) both}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:680}
    h1,.question{margin:0;max-width:560px;font-size:clamp(37px,10.2vw,67px);line-height:.98;letter-spacing:-.047em;font-weight:570}
    .question{font-size:clamp(31px,8.3vw,51px);line-height:1.02;margin-bottom:25px}
    .period{color:var(--accent)}
    .lede{margin:15px 0 0;color:#b5b5af;font-size:16px;line-height:1.55;max-width:500px}
    .hint{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
    .options{display:grid;gap:9px;margin-top:25px}
    .choice{
      appearance:none;width:100%;min-height:58px;border:1px solid var(--line);border-radius:13px;
      background:var(--surface);color:var(--text);padding:15px 17px;text-align:left;cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      transition:border-color .15s ease,transform .15s ease,background .15s ease;
    }
    .choice:hover,.choice:focus-visible{border-color:#565650;background:#10100f;outline:none}.choice:active{transform:scale(.992)}
    .choice.selected{border-color:var(--accent);background:#0b1209;box-shadow:0 0 0 1px rgba(57,255,20,.05) inset}
    .choice .arrow{color:#575751;font-size:17px}.choice.selected .arrow{color:var(--accent)}
    .choice.multi .arrow{font-size:15px}.choice.multi.selected .arrow::before{content:'✓'}.choice.multi:not(.selected) .arrow::before{content:'+'}
    .choice.multi .arrow{font-size:16px}.choice.multi .arrow{color:#6d6d66}
    .choice.multi.selected .arrow{color:var(--accent)}
    .next,.whatsapp,.appeal{
      appearance:none;margin-top:27px;width:100%;min-height:58px;border:0;border-radius:13px;
      background:var(--text);color:#070707;font-weight:760;cursor:pointer;display:flex;align-items:center;justify-content:center;
      text-decoration:none;transition:transform .15s ease,opacity .15s ease;
    }
    .next:disabled{opacity:.26;cursor:not-allowed}.next:not(:disabled):active,.whatsapp:active,.appeal:active{transform:scale(.992)}
    .whatsapp{background:var(--accent);color:#061102}.appeal{background:var(--text)}
    .skip{appearance:none;display:block;margin:14px auto 0;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:7px 10px;font-size:13px}
    .field{
      width:100%;background:transparent;border:0;border-bottom:1px solid #343431;color:var(--text);padding:14px 0 13px;border-radius:0;outline:none;
      font-size:clamp(21px,5.4vw,29px);letter-spacing:-.02em;caret-color:var(--accent);transition:border-color .16s ease;
    }
    .field:focus{border-color:var(--accent)}.field::placeholder{color:#4d4d49}
    .counter{margin-top:8px;color:var(--dim);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
    .build{min-height:18px;margin-top:8px;color:var(--accent);font-size:13px;letter-spacing:.02em}
    .section-label{margin:25px 0 10px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:680}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);
      padding:10px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease;
    }
    .chip:hover,.chip:focus-visible{outline:none;border-color:#55554f}.chip:active{transform:scale(.985)}.chip.selected{border-color:var(--accent);background:#0b1209}
    .stats{display:grid;gap:9px;margin-top:24px}.stat-row{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:13px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
    .stat-name{font-weight:650}.stat-controls{display:flex;align-items:center;gap:10px}.stat-btn{appearance:none;width:35px;height:35px;border:1px solid #343430;border-radius:10px;background:#10100f;color:var(--text);cursor:pointer;font-size:19px;line-height:1}.stat-btn:disabled{opacity:.24;cursor:not-allowed}.stat-value{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-weight:760}.remaining{margin-top:14px;color:var(--muted);font-size:13px}.remaining strong{color:var(--accent);font-variant-numeric:tabular-nums}
    .split{display:grid;gap:22px}.compact-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.compact-options.three{grid-template-columns:repeat(3,minmax(0,1fr))}.mini{appearance:none;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:11px 8px;cursor:pointer;text-align:center;line-height:1.15}.mini.selected{border-color:var(--accent);background:#0b1209}.mini:hover,.mini:focus-visible{outline:none;border-color:#55554f}
    .result-card{margin-top:23px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#0d0d0c,#090909);padding:17px}.result-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;color:#b9b9b3;font-size:13px}.result-row span:last-child{text-align:right;color:var(--text)}
    .danger{color:var(--danger)}
    .final h1{margin-bottom:19px}.final .lede{margin-top:0}.micro{margin-top:17px;color:#62625c;font-size:12px;line-height:1.5}
    footer{min-height:18px;color:#3d3d39;font-size:10px;letter-spacing:.05em}
    @media(max-width:410px){.compact-options.three{grid-template-columns:repeat(3,minmax(0,1fr))}.compact-options{grid-template-columns:1fr}.mini{font-size:14px;padding:10px 6px}.shell{padding-left:18px;padding-right:18px}}
    @media(min-width:680px){.shell{padding-left:10px;padding-right:10px}main{padding-bottom:72px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="back" id="back" type="button" aria-label="Zurück">← Zurück</button>
      <div class="hud"><span class="step" id="step"></span><button class="sfx" id="sfx" type="button" aria-label="Toggle sound">SFX</button></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer aria-hidden="true"></footer>
  </div>

  <script>
  (() => {
    const PHONE='491621726520';
    const app=document.getElementById('app');
    const back=document.getElementById('back');
    const stepEl=document.getElementById('step');
    const sfxEl=document.getElementById('sfx');

    const initialStats=()=>({Brains:0,Courage:0,Charm:0,Stamina:0,Chaos:0});
    const initialAnswers=()=>({identity:'',path:'',stats:initialStats(),interests:[],talent:'',moral:'',height:'',build:'',type:'',vibe:'',difficulty:'',scene:'',quest:''});
    const state={screen:'identity',history:[],sound:true,appealed:false,interestsFull:false,answers:initialAnswers()};

    const analytics={lastView:''};
    function cleanProps(input={}){const out={};for(const [k,v] of Object.entries(input)){if(['string','number','boolean'].includes(typeof v)||v===null)out[k]=typeof v==='string'?v.slice(0,500):v;else if(Array.isArray(v))out[k]=v.slice(0,12).map(x=>String(x).slice(0,120));else if(v&&typeof v==='object')out[k]=JSON.stringify(v).slice(0,1000)}return out}
    function track(event,props={}){const detail={event,props:cleanProps(props),ts:Date.now()};try{window.dispatchEvent(new CustomEvent('nyb:analytics',{detail}))}catch{}try{if(window.posthog&&typeof window.posthog.capture==='function')window.posthog.capture(event,detail.props)}catch{}}
    function trackView(key,props={}){if(analytics.lastView===key)return;analytics.lastView=key;track('screen_viewed',{screen:key,...props})}
    window.NYB_ANALYTICS={track};

    let audioCtx=null;
    function audio(){if(!state.sound)return null;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
    function tone(freq,duration=.055,type='sine',gain=.022,delay=0){const ctx=audio();if(!ctx)return;const o=ctx.createOscillator();const g=ctx.createGain();const t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}
    function sweep(from,to,duration=.09,gain=.008){const ctx=audio();if(!ctx)return;const o=ctx.createOscillator();const g=ctx.createGain();const t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(to,t+duration);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}
    function sfx(kind='select'){
      if(!state.sound)return;
      if(kind==='select'){tone(760,.045,'sine',.017);navigator.vibrate?.(12)}
      else if(kind==='next'){sweep(360,620)}
      else if(kind==='fail'){tone(170,.14,'square',.018);setTimeout(()=>tone(105,.17,'square',.014),70);navigator.vibrate?.([20,35,20])}
      else if(kind==='unlock'){tone(620,.075,'sine',.018);tone(920,.12,'sine',.02,.07);navigator.vibrate?.(18)}
      else if(kind==='success'){tone(880,.08,'sine',.02);tone(1320,.16,'sine',.018,.085);navigator.vibrate?.(18)}
    }

    const INTERESTS=['Coding','Sports','Gaming','Creative','Art','Music','Outdoors','Business','Building stuff','Aura farming'];
    const MORALS=['Without hesitation.','Depends what we\'re fighting for.','I\'d rather outsmart them.','I\'m not dying for a side quest.'];
    const HEIGHTS=['Hobbit · ~160 cm','~175 cm','182+ cm'];
    const BUILDS=['Muscle','Lean','Dad bod'];
    const TYPES=['Hard to get','Wild Cat','Kreativ','Freigeist','Ruhepol','Bum · viel Zeit, wenig Geld'];
    const VIBES=['Netflix & chill','Cinema','Anime night','Horror night','So bad it\'s good'];
    const DIFFICULTIES=['Nur schauen, nicht anfassen.','Noch geheim.','You don’t know what you’re in for.','Fantasyroman mit Romantik.','Soap Opera.'];
    const ROMANTIC_SCENES=['Over coffee or drinks.','At the cinema.','On a night drive.','Auf einer Wanderung.','Anime night.','Bei einem Plan mit abenteuerlichem Ausgang.','Surprise me.'];
    const QUESTS=['Building something stupid.','Coding something useful.','In the middle of a gym challenge.','On a questionable hike.','On a road trip.','Making money.','Learning a ridiculous skill.'];
    const CLASS_NAMES={'Brains+Chaos':'Mad scientist build.','Charm+Chaos':'Menace build.','Courage+Stamina':'Main character build.','Brains+Charm':'Final boss build.'};

    function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    function compact(value){return String(value||'').replace(/\s+/g,' ').trim()}
    function statTotal(){return Object.values(state.answers.stats).reduce((a,b)=>a+b,0)}
    function isRomantic(){return state.answers.identity==='She'&&state.answers.path==='romantic'}
    function isQuest(){return state.answers.identity==='He'||state.answers.path==='quest'}
    function isPreferred(){return state.answers.height==='~175 cm'&&(state.answers.build==='Muscle'||state.answers.build==='Lean')}

    function statsLine(){return Object.entries(state.answers.stats).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}`).join(' · ')}
    function className(){const maxed=Object.entries(state.answers.stats).filter(([,v])=>v===5).map(([k])=>k);return maxed.length===2?(CLASS_NAMES[maxed.join('+')]||''):''}

    function expectedScreens(){
      if(state.answers.identity==='She'&&state.answers.path==='romantic')return ['identity','path','romantic-profile','talent','difficulty','romantic-scene','final'];
      if(state.answers.identity==='She'&&state.answers.path==='quest')return ['identity','path','stats','interests','talent','values','quest','final'];
      if(state.answers.identity==='He')return ['identity','stats','interests','talent','values','quest','final'];
      return ['identity'];
    }
    function updateHud(){
      back.classList.toggle('visible',state.history.length>0&& !['final','denied','exception'].includes(state.screen));
      const flow=expectedScreens();const idx=flow.indexOf(state.screen);
      stepEl.textContent=flow.length>1&&idx>=0?`${String(idx+1).padStart(2,'0')} / ${String(flow.length).padStart(2,'0')}`:'';
      sfxEl.classList.toggle('off',!state.sound);sfxEl.setAttribute('aria-pressed',String(state.sound));
    }
    function go(screen,{replace=false,sound='next'}={}){if(screen===state.screen)return;if(!replace)state.history.push(state.screen);state.screen=screen;sfx(sound);analytics.lastView='';render()}
    function resetForIdentity(){state.answers=initialAnswers();state.appealed=false;state.interestsFull=false}
    function chooseSingle(key,value,next,event){state.answers[key]=value;track('answer_selected',{question:key,choice:value,path:state.answers.path||'unset'});if(event)track(event,{choice:value,path:state.answers.path||'unset'});sfx('select');setTimeout(()=>go(next,{sound:'next'}),105)}

    function btnChoice(label,key,next,event=''){const selected=state.answers[key]===label;return `<button class="choice${selected?' selected':''}" type="button" data-single-key="${key}" data-value="${escapeHtml(label)}" data-next="${next}" data-event="${event}"><span>${escapeHtml(label)}</span><span class="arrow">↗</span></button>`}

    function renderIdentity(){
      trackView('identity');
      app.innerHTML=`<section class="panel"><p class="eyebrow">NOT YOUR BUSINESS.</p><h1>Who are you<span class="period">?</span></h1><p class="lede">Character assessment in progress.<br>Quest locked.</p><div class="options"><button class="choice" type="button" data-identity="She"><span>She</span><span class="arrow">↗</span></button><button class="choice" type="button" data-identity="He"><span>He</span><span class="arrow">↗</span></button></div></section>`;
      app.querySelectorAll('[data-identity]').forEach(b=>b.addEventListener('click',()=>{resetForIdentity();state.answers.identity=b.dataset.identity;track('gender_selected',{identity:b.dataset.identity});sfx('select');setTimeout(()=>{if(b.dataset.identity==='She')go('path');else{state.answers.path='quest';go('stats')}},105)}));
    }

    function renderPath(){
      trackView('path');
      app.innerHTML=`<section class="panel"><p class="eyebrow">NOT YOUR BUSINESS.</p><h2 class="question">Choose your path, traveler<span class="period">.</span></h2><div class="options"><button class="choice" type="button" data-path="romantic"><span>Secretly romantic.</span><span class="arrow">↗</span></button><button class="choice" type="button" data-path="quest"><span>I am here to embark on a quest.</span><span class="arrow">↗</span></button></div></section>`;
      app.querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>{const a=state.answers;if(a.path&&a.path!==b.dataset.path){a.moral='';a.height='';a.build='';a.type='';a.vibe='';a.difficulty='';a.scene='';a.quest='';state.appealed=false}a.path=b.dataset.path;track('path_selected',{path:b.dataset.path});sfx('select');setTimeout(()=>go(b.dataset.path==='romantic'?'romantic-profile':'stats'),105)}));
    }

    function renderTalent(){
      trackView('talent',{path:state.answers.path});
      const required=isRomantic();
      const hasTalent=!!compact(state.answers.talent);
      app.innerHTML=`<section class="panel"><p class="eyebrow">YOUR STAT</p><h2 class="question">Secret talent<span class="period">?</span></h2><input class="field" id="talent" maxlength="120" autocomplete="off" enterkeyhint="next" placeholder="Etwas, das man dir nicht ansieht …" value="${escapeHtml(state.answers.talent)}" /><p class="counter" id="talent-count">${state.answers.talent.length} / 120</p><button class="next" id="talent-next" type="button" ${required&&!hasTalent?'disabled':''}>${hasTalent?'Weiter':required?'Weiter':'Bleibt geheim.'}</button></section>`;
      const input=document.getElementById('talent');const count=document.getElementById('talent-count');const next=document.getElementById('talent-next');
      const done=()=>{const value=compact(input.value);if(required&&!value)return;state.answers.talent=value;track('stat_text_completed',{talent:state.answers.talent,skipped:!value,length:state.answers.talent.length,path:state.answers.path});go(isRomantic()?'difficulty':'values')};
      input.addEventListener('input',()=>{const value=compact(input.value);count.textContent=`${input.value.length} / 120`;next.disabled=required&&!value;next.textContent=value?'Weiter':required?'Weiter':'Bleibt geheim.'});
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done()}});
      next.addEventListener('click',done);
    }

    function renderStats(){
      trackView('stats',{path:state.answers.path});
      const total=statTotal();const remaining=10-total;
      app.innerHTML=`<section class="panel"><p class="eyebrow">ALLOCATE YOUR STATS</p><h2 class="question">Wie ist dein Charakter<span class="period">?</span></h2><div class="stats">${Object.entries(state.answers.stats).map(([name,val])=>`<div class="stat-row"><span class="stat-name">${name}</span><div class="stat-controls"><button class="stat-btn" type="button" data-stat="${name}" data-delta="-1" ${val<=0?'disabled':''} aria-label="Decrease ${name}">−</button><span class="stat-value">${val}</span><button class="stat-btn" type="button" data-stat="${name}" data-delta="1" ${val>=5||remaining<=0?'disabled':''} aria-label="Increase ${name}">+</button></div></div>`).join('')}</div><p class="remaining"><strong>${remaining}</strong> points remaining.<br>Max. 5 pro Wert.</p><p class="build">${escapeHtml(className())}</p><button class="next" id="stats-next" type="button" ${remaining!==0?'disabled':''}>Lock in stats</button></section>`;
      app.querySelectorAll('[data-stat]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.stat;const delta=Number(b.dataset.delta);const current=state.answers.stats[name];const next=current+delta;if(next<0||next>5)return;if(delta>0&&statTotal()>=10)return;state.answers.stats[name]=next;sfx('select');track('stat_changed',{stat:name,value:next,total:statTotal()});render()}));
      document.getElementById('stats-next')?.addEventListener('click',()=>{track('stats_allocated',{stats:state.answers.stats,build:className()});go('interests')});
    }

    function renderInterests(){
      trackView('interests',{path:state.answers.path});
      app.innerHTML=`<section class="panel"><p class="eyebrow">CHOOSE YOUR INTERESTS</p><h2 class="question">Deine Talente<span class="period">.</span></h2><p class="hint${state.interestsFull?' danger':''}">${state.interestsFull?'Maximal 4.':'Bis zu 4.'}</p><div class="chips" style="margin-top:22px">${INTERESTS.map(v=>`<button class="chip${state.answers.interests.includes(v)?' selected':''}" type="button" data-interest="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}</div><button class="next" id="interests-next" type="button" ${state.answers.interests.length<1?'disabled':''}>Weiter</button></section>`;
      app.querySelectorAll('[data-interest]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.interest;const a=state.answers.interests;const i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<4)a.push(v);else{state.interestsFull=true;sfx('fail');render();return}state.interestsFull=false;track('interest_toggled',{interest:v,selected:i<0,interests:a});sfx('select');render()}));
      document.getElementById('interests-next')?.addEventListener('click',()=>{state.interestsFull=false;track('interests_selected',{interests:state.answers.interests,count:state.answers.interests.length});go('talent')});
    }

    function renderValues(){
      trackView('values',{path:state.answers.path});
      app.innerHTML=`<section class="panel"><p class="eyebrow">YOUR VALUES ARE UNDER ATTACK.</p><h2 class="question">You face a thousand men in battle<span class="period">.</span></h2><p class="lede" style="margin-top:-8px">Would you fight for what you believe in?</p><div class="options">${MORALS.map(v=>btnChoice(v,'moral','quest','values_answered')).join('')}</div></section>`;
      bindSingleChoices();
    }

    function renderRomanticProfile(){
      trackView('romantic_profile');
      const a=state.answers;const ready=a.height&&a.build&&a.type&&a.vibe;
      const group=(label,key,values,layout,first)=>`<div><p class="section-label"${first?' style="margin-top:0"':''}>${label}</p><div class="${layout}">${values.map(v=>`<button class="${layout==='chips'?'chip':'mini'}${a[key]===v?' selected':''}" type="button" data-profile="${key}" data-value="${escapeHtml(v)}">${escapeHtml(v).replace(' cm','&nbsp;cm')}</button>`).join('')}</div></div>`;
      app.innerHTML=`<section class="panel"><p class="eyebrow">PREFERRED TYPE.</p><h2 class="question">Was ist eher dein Typ<span class="period">?</span></h2><div class="split">${group('Größe?','height',HEIGHTS,'compact-options three',true)}${group('Statur?','build',BUILDS,'compact-options three')}${group('Typ?','type',TYPES,'chips')}${group('Vibe?','vibe',VIBES,'chips')}</div><button class="next" id="profile-next" type="button" ${ready?'':'disabled'}>Weiter</button></section>`;
      app.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>{state.answers[b.dataset.profile]=b.dataset.value;track('answer_selected',{question:b.dataset.profile,choice:b.dataset.value});sfx('select');render()}));
      document.getElementById('profile-next')?.addEventListener('click',()=>{track('attraction_answered',{height:a.height,build:a.build,type:a.type,vibe:a.vibe});go('talent')});
    }

    function renderDifficulty(){
      trackView('difficulty');
      app.innerHTML=`<section class="panel"><h2 class="question">Was ist dein Vibe<span class="period">?</span></h2><div class="options">${DIFFICULTIES.map(v=>btnChoice(v,'difficulty','romantic-scene','difficulty_selected')).join('')}</div></section>`;
      bindSingleChoices();
    }

    function renderRomanticScene(){
      trackView('romantic_scene');
      app.innerHTML=`<section class="panel"><p class="eyebrow">PICK YOUR VIBE.</p><h2 class="question">Wo fängt es an<span class="period">?</span></h2><div class="options">${ROMANTIC_SCENES.map(v=>`<button class="choice${state.answers.scene===v?' selected':''}" type="button" data-romantic-scene="${escapeHtml(v)}"><span>${escapeHtml(v)}</span><span class="arrow">↗</span></button>`).join('')}</div></section>`;
      app.querySelectorAll('[data-romantic-scene]').forEach(b=>b.addEventListener('click',()=>{state.answers.scene=b.dataset.romanticScene;track('romantic_scene_selected',{scene:b.dataset.romanticScene});sfx('select');setTimeout(()=>finishRomantic(),120)}));
    }

    function finishRomantic(){
      track('romantic_gate_evaluated',{height:state.answers.height,build:state.answers.build,type:state.answers.type,preferred:isPreferred()});
      if(isPreferred())go('final',{sound:'success'});else{sfx('fail');go('denied',{sound:null})}
    }

    function renderDenied(){
      trackView('denied',{path:'romantic'});
      app.innerHTML=`<section class="panel final"><p class="eyebrow danger">DECISION.</p><h1>Denied<span class="period">.</span></h1><p class="lede">You may appeal this decision.</p><button class="appeal" id="appeal" type="button">Appeal decision</button></section>`;
      document.getElementById('appeal').addEventListener('click',()=>{state.appealed=true;track('appeal_clicked',{path:'romantic'});sfx('unlock');go('exception',{sound:null})});
    }

    function renderException(){
      trackView('exception',{path:'romantic'});
      app.innerHTML=`<section class="panel final"><p class="eyebrow">APPEAL ACCEPTED.</p><h1>Fine<span class="period">.</span></h1><p class="lede">We'll make an exception.</p><button class="next" id="exception-next" type="button">Weiter</button></section>`;
      document.getElementById('exception-next').addEventListener('click',()=>go('final',{sound:'success'}));
    }

    function renderQuest(){
      trackView('quest',{identity:state.answers.identity});
      app.innerHTML=`<section class="panel"><p class="eyebrow">PICK YOUR QUEST.</p><h2 class="question">Wo beginnt das Abenteuer<span class="period">?</span></h2><div class="options">${QUESTS.map(v=>`<button class="choice${state.answers.quest===v?' selected':''}" type="button" data-quest="${escapeHtml(v)}"><span>${escapeHtml(v)}</span><span class="arrow">↗</span></button>`).join('')}</div></section>`;
      app.querySelectorAll('[data-quest]').forEach(b=>b.addEventListener('click',()=>{state.answers.quest=b.dataset.quest;track('quest_selected',{quest:b.dataset.quest,path:'quest'});sfx('select');setTimeout(()=>go('final',{sound:'success'}),120)}));
    }

    function travelerLine(){const a=state.answers;return a.identity+(a.identity==='She'&&a.path?` · ${a.path==='romantic'?'Secretly romantic':'Quest'}`:'')}
    function summaryRows(){
      const a=state.answers;const rows=[['Traveler',travelerLine()]];
      if(a.talent)rows.push(['Secret talent',a.talent]);
      if(isRomantic()){
        rows.push(['Preferred type',[a.height,a.build,a.type].filter(Boolean).join(' · ')]);
        rows.push(['Vibe',a.vibe]);
        rows.push(['Difficulty',a.difficulty]);
        if(a.scene)rows.push(['Scene',a.scene]);
      } else {
        rows.push(['Stats',statsLine()]);
        if(a.interests.length)rows.push(['Interests',a.interests.join(', ')]);
        if(a.moral)rows.push(['Values',a.moral]);
        if(a.quest)rows.push(['Quest',a.quest]);
      }
      return rows;
    }
    function messageText(){
      const lines=['NOT YOUR BUSINESS. — character sheet',...summaryRows().map(([k,v])=>`${k}: ${v}`)];
      if(isRomantic()&&state.appealed)lines.push('Appeal: accepted');
      return lines.join('\n');
    }
    function whatsappUrl(){return `https://wa.me/${PHONE}?text=${encodeURIComponent(messageText())}`}
    function completeSurvey(){const a=state.answers;track('character_completed',{identity:a.identity,path:a.path,stats:a.stats,build_class:className(),interests:a.interests,talent:a.talent,moral:a.moral,height:a.height,build:a.build,type:a.type,vibe:a.vibe,difficulty:a.difficulty,scene:a.scene,quest:a.quest,appealed:state.appealed})}

    function renderFinal(){
      trackView('final',{path:state.answers.path,identity:state.answers.identity});completeSurvey();
      const rows=`<div class="result-card">${summaryRows().map(([k,v])=>`<div class="result-row"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('')}</div>`;
      if(isRomantic()){
        app.innerHTML=`<section class="panel final"><h1>Let's see where this goes<span class="period">.</span></h1>${rows}<a class="whatsapp" id="join" href="${whatsappUrl()}">Let's find out</a><p class="micro">Deine Antworten stehen schon in der Nachricht. Vor dem Senden kannst du alles ändern.</p></section>`;
        document.getElementById('join').addEventListener('click',()=>track('romantic_contact_clicked',{path:'romantic',scene:state.answers.scene}));
      }else{
        app.innerHTML=`<section class="panel final"><p class="eyebrow">CHARACTER ACCEPTED.</p><h1>Quest unlocked<span class="period">.</span></h1><p class="lede">Geschafft.</p>${rows}<a class="whatsapp" id="join" href="${whatsappUrl()}">Join the party</a><p class="micro">Deine Antworten stehen schon in der Nachricht. Vor dem Senden kannst du alles ändern.</p></section>`;
        document.getElementById('join').addEventListener('click',()=>track('join_party_clicked',{path:'quest',quest:state.answers.quest}));
      }
    }

    function bindSingleChoices(){
      app.querySelectorAll('[data-single-key]').forEach(b=>b.addEventListener('click',()=>chooseSingle(b.dataset.singleKey,b.dataset.value,b.dataset.next,b.dataset.event)));
    }

    function render(){
      updateHud();
      if(state.screen==='identity')renderIdentity();
      else if(state.screen==='path')renderPath();
      else if(state.screen==='talent')renderTalent();
      else if(state.screen==='stats')renderStats();
      else if(state.screen==='interests')renderInterests();
      else if(state.screen==='values')renderValues();
      else if(state.screen==='romantic-profile')renderRomanticProfile();
      else if(state.screen==='difficulty')renderDifficulty();
      else if(state.screen==='romantic-scene')renderRomanticScene();
      else if(state.screen==='denied')renderDenied();
      else if(state.screen==='exception')renderException();
      else if(state.screen==='quest')renderQuest();
      else if(state.screen==='final')renderFinal();
    }

    back.addEventListener('click',()=>{if(!state.history.length)return;const prev=state.history.pop();track('back_clicked',{from:state.screen,to:prev});state.screen=prev;analytics.lastView='';sfx('select');render()});
    sfxEl.addEventListener('click',()=>{state.sound=!state.sound;if(state.sound)sfx('unlock');track('sfx_toggled',{enabled:state.sound});updateHud()});

    track('game_started',{referrer:document.referrer?(()=>{try{return new URL(document.referrer).hostname}catch{return 'unknown'}})():'direct'});
    render();
  })();
  </script>
</body>
</html>
