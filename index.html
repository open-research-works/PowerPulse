<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <title>NOT YOUR BUSINESS.</title>
  <meta name="description" content="A small question." />
  <style>
    :root { --bg:#050505; --surface:#0b0b0b; --text:#f4f4f2; --muted:#8f8f8a; --line:#242424; --accent:#39ff14; --max:560px; }
    *{box-sizing:border-box} html,body{min-height:100%} body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision} button,input{font:inherit}
    .shell{min-height:100svh;width:min(100%,var(--max));margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 24px max(26px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:18px}.topbar{min-height:34px;display:flex;align-items:center;justify-content:space-between}.back{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 0;cursor:pointer;font-size:14px;opacity:0;pointer-events:none;transition:color .18s ease,opacity .18s ease}.back.visible{opacity:1;pointer-events:auto}.back:hover,.back:focus-visible{color:var(--text)}.progress{display:flex;align-items:center;gap:7px}.dot{width:5px;height:5px;border-radius:999px;background:#2a2a2a;transition:width .24s ease,background .24s ease}.dot.done{background:#6f6f69}.dot.active{width:18px;background:var(--accent)} main{display:flex;align-items:center;padding:30px 0 50px}.panel{width:100%;animation:enter .28s cubic-bezier(.2,.75,.25,1) both}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.eyebrow{margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:650}h1{margin:0;max-width:520px;font-size:clamp(38px,10.8vw,68px);line-height:.98;letter-spacing:-.045em;font-weight:560}h1 .period{color:var(--accent)}.question{margin:0 0 28px;font-size:clamp(31px,8.4vw,52px);line-height:1.03;letter-spacing:-.035em;font-weight:540}.options{display:grid;gap:10px}.choice{appearance:none;width:100%;min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:15px 17px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .16s ease,transform .16s ease,background .16s ease}.choice:hover,.choice:focus-visible{border-color:#565650;background:#101010;outline:none}.choice:active{transform:scale(.992)}.choice.selected{border-color:var(--accent)}.arrow{color:#5a5a55;font-size:17px;margin-left:14px}.field{width:100%;background:transparent;border:0;border-bottom:1px solid #343431;color:var(--text);padding:14px 0 13px;border-radius:0;outline:none;font-size:clamp(21px,5.6vw,29px);letter-spacing:-.02em;caret-color:var(--accent);transition:border-color .18s ease}.field:focus{border-color:var(--accent)}.field::placeholder{color:#4d4d49}.next,.whatsapp,.appeal{appearance:none;margin-top:28px;width:100%;min-height:58px;border:0;border-radius:12px;background:var(--text);color:#070707;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .16s ease,opacity .16s ease}.next:active,.whatsapp:active,.appeal:active{transform:scale(.992)}.next:hover,.whatsapp:hover,.appeal:hover{opacity:.92}.skip{appearance:none;display:block;margin:15px auto 0;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px 10px;font-size:13px}.final{padding-top:8px}.final h1{margin-bottom:24px}.sub{margin:0;color:#b8b8b2;font-size:16px;line-height:1.5}.whatsapp{background:var(--accent);color:#061102;margin-top:30px}.appeal{background:var(--text);margin-top:30px}footer{color:#4c4c48;font-size:11px;letter-spacing:.03em;min-height:20px}@media(min-width:680px){.shell{padding-left:10px;padding-right:10px}main{padding-bottom:80px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="shell"><header class="topbar"><button class="back" id="back" type="button" aria-label="Go back">← Back</button><div class="progress" id="progress" aria-label="Progress"></div></header><main id="app" aria-live="polite"></main><footer>Nothing is saved here.</footer></div>
  <script>
    (()=>{const PHONE='491621726520';const state={step:0,appeal:false,attempts:0,screen:'questions',answers:{height:'',build:'',type:'',trip:'',hobby:''}};const steps=[{id:'height',kind:'choice',eyebrow:'CHOOSE YOUR TYPE.',title:'Height?',options:['Hobbit · ~160 cm','~175 cm','182+ cm']},{id:'build',kind:'choice',eyebrow:'CHOOSE YOUR TYPE.',title:'Build?',options:['Muscle','Lean','Dad bod']},{id:'type',kind:'choice',eyebrow:'CHOOSE YOUR TYPE.',title:'Type?',options:['Hard to get','Kreativ','Freigeist','Ruhepol','Bum · viel Zeit, wenig Geld']},{id:'trip',kind:'text',eyebrow:'ONE MORE THING.',title:'Best trip?',placeholder:'Somewhere worth going back to…'},{id:'hobby',kind:'text',eyebrow:'LAST ONE.',title:'Secret hobby?',placeholder:'No judgement.'}];const app=document.getElementById('app');const back=document.getElementById('back');const progress=document.getElementById('progress');function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function compactAnswer(value){return String(value||'').replace(/\s+/g,' ').trim()}function progressMarkup(){const max=state.appeal?3:5;const activeIndex=Math.min(state.step,max-1);return Array.from({length:max},(_,i)=>{const klass=i<activeIndex?'dot done':i===activeIndex?'dot active':'dot';return `<span class="${klass}" aria-hidden="true"></span>`}).join('')}function messageText(){const a=state.answers;const first=[a.height,a.build,a.type].filter(Boolean).join(' · ');const lines=[];if(first)lines.push(first);if(compactAnswer(a.trip))lines.push(`Best trip: ${compactAnswer(a.trip)}`);if(compactAnswer(a.hobby))lines.push(`Secret hobby: ${compactAnswer(a.hobby)}`);return lines.join('\n')}function whatsappUrl(){return `https://wa.me/${PHONE}?text=${encodeURIComponent(messageText())}`}function isPreferred(){return state.answers.height==='~175 cm'&&(state.answers.build==='Muscle'||state.answers.build==='Lean')}function finishGate(){if(isPreferred()){state.screen='accepted'}else if(state.attempts>=1){state.screen='exception'}else{state.screen='denied'}render()}function render(){back.classList.toggle('visible',state.screen==='questions'&&state.step>0);progress.innerHTML=state.screen==='questions'?progressMarkup():'';if(state.screen==='accepted'){app.innerHTML=`<section class="panel final"><p class="eyebrow">APPROVED.</p><h1>Okay. That works<span class="period">.</span></h1><p class="sub">You made it.</p><a class="whatsapp" href="${whatsappUrl()}">Say hi</a></section>`;return}if(state.screen==='exception'){app.innerHTML=`<section class="panel final"><p class="eyebrow">APPEAL ACCEPTED.</p><h1>Fine. We'll make an exception<span class="period">.</span></h1><p class="sub">You made it.</p><a class="whatsapp" href="${whatsappUrl()}">Say hi</a></section>`;return}if(state.screen==='denied'){app.innerHTML=`<section class="panel final"><p class="eyebrow">DECISION.</p><h1>Denied<span class="period">.</span></h1><p class="sub">You may appeal this decision.</p><button class="appeal" id="appeal" type="button">Appeal decision</button></section>`;document.getElementById('appeal').addEventListener('click',()=>{state.attempts+=1;state.appeal=true;state.step=0;state.screen='questions';render()});return}const step=steps[state.step];if(step.kind==='choice'){const selected=state.answers[step.id];const eyebrow=state.appeal?'APPEAL.':step.eyebrow;app.innerHTML=`<section class="panel"><p class="eyebrow">${eyebrow}</p><h2 class="question">${step.title}</h2><div class="options">${step.options.map(option=>`<button class="choice${selected===option?' selected':''}" type="button" data-choice="${escapeHtml(option)}"><span>${escapeHtml(option)}</span><span class="arrow">↗</span></button>`).join('')}</div></section>`;app.querySelectorAll('[data-choice]').forEach(button=>{button.addEventListener('click',()=>{state.answers[step.id]=button.dataset.choice;button.classList.add('selected');window.setTimeout(()=>{if(state.appeal&&state.step===2){finishGate()}else{state.step+=1;render()}},115)})});return}const current=state.answers[step.id]||'';app.innerHTML=`<section class="panel"><p class="eyebrow">${step.eyebrow}</p><h2 class="question">${step.title}</h2><input class="field" id="answer" maxlength="120" autocomplete="off" inputmode="text" placeholder="${escapeHtml(step.placeholder)}" value="${escapeHtml(current)}" /><button class="next" id="next" type="button">Next</button><button class="skip" id="skip" type="button">Skip</button></section>`;const input=document.getElementById('answer');const proceed=()=>{state.answers[step.id]=compactAnswer(input.value);if(state.step===4){finishGate()}else{state.step+=1;render()}};document.getElementById('next').addEventListener('click',proceed);document.getElementById('skip').addEventListener('click',()=>{state.answers[step.id]='';if(state.step===4){finishGate()}else{state.step+=1;render()}});input.addEventListener('keydown',event=>{if(event.key==='Enter')proceed()});window.setTimeout(()=>input.focus({preventScroll:true}),40)}back.addEventListener('click',()=>{if(state.screen==='questions'&&state.step>0){state.step-=1;render()}});render()})();
  </script>
</body>
</html>
