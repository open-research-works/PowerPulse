    let LANG=(()=>{try{const s=localStorage.getItem('nyb-lang');if(s==='de'||s==='en')return s}catch{}return String(navigator.language||'de').toLowerCase().startsWith('de')?'de':'en'})();

    const CLASS_NAMES={'Brains+Chaos':'Mad scientist build.','Charm+Chaos':'Menace build.','Courage+Stamina':'Main character build.','Brains+Charm':'Final boss build.'};

    function statTotal(){return Object.values(state.answers.stats).reduce((a,b)=>a+b,0)}
    function isRomantic(){return state.answers.identity==='She'&&state.answers.path==='romantic'}

    function statsLine(){return Object.entries(state.answers.stats).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}`).join(' · ')}
    function className(){const maxed=Object.entries(state.answers.stats).filter(([,v])=>v===5).map(([k])=>k);return maxed.length===2?(CLASS_NAMES[maxed.join('+')]||''):''}

    function expectedScreens(){

      if(state.answers.identity==='She'&&state.answers.path==='quest')return ['identity','path','about','interests','talent','story','trick','values','quest','current','side','formation','final'];
      if(state.answers.identity==='He')return ['identity','about','interests','talent','story','trick','values','quest','current','side','formation','final'];

    function updateHud(){

      stepEl.textContent=flow.length>1&&idx>=0?`${String(idx+1).padStart(2,'0')} / ${String(flow.length).padStart(2,'0')}`:'';

    }

    function picks(key){const a=state.answers;return [...a[key],...(a.own[key]?[a.own[key]]:[])]}
    function pickText(key){return picks(key).map(s=>s.replace(/\.$/,'')).join(', ')}
    function ownField(key,placeholder=L().ownPh){return `<input class="field own" data-own="${key}" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(state.answers.own[key])}" />`}

    function multiList(key,items){const a=state.answers;return `<div class="options">${items.map(it=>{const [v,sub]=Array.isArray(it)?it:[it,''];return `<button class="choice${a[key].includes(v)?' selected':''}" type="button" data-multi="${key}" data-value="${escapeHtml(v)}"><span>${escapeHtml(v)}${sub?`<small class="choice-sub">${escapeHtml(sub)}</small>`:''}</span><span class="arrow">↗</span></button>`}).join('')}</div><p class="section-label">${L().ownLabel}</p>${ownField(key,L().ownListPh)}`}
    function bindMulti(onChange){
      app.querySelectorAll('[data-multi]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.multi,v=b.dataset.value,l=state.answers[k];const i=l.indexOf(v);if(i>=0)l.splice(i,1);else l.push(v);b.classList.toggle('selected',i<0);track('answer_toggled',{question:k,choice:v,selected:i<0});sfx('select');onChange()}));
      app.querySelectorAll('[data-own]').forEach(inp=>{inp.addEventListener('input',()=>{state.answers.own[inp.dataset.own]=compact(inp.value);onChange()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}})});

    function ownSingle(key,list,next,event){const a=state.answers;const own=a[key]&&!list.includes(a[key])?a[key]:'';return `<p class="section-label">${L().ownLabel}</p><input class="field own" id="own-single" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="${L().ownSinglePh}" value="${escapeHtml(own)}" /><button class="next" id="own-next" type="button" data-key="${key}" data-next="${next}" data-event="${event}" ${own?'':'disabled'}>${L().next}</button>`}
    function bindOwnSingle(){const inp=document.getElementById('own-single');const btn=document.getElementById('own-next');if(!inp)return;const done=()=>{const v=compact(inp.value);if(!v)return;state.answers[btn.dataset.key]=v;track(btn.dataset.event,{choice:v,own:true,path:state.answers.path});go(btn.dataset.next)};inp.addEventListener('input',()=>{btn.disabled=!compact(inp.value)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done()}});btn.addEventListener('click',done)}

    function renderRomanticProfile(){
      trackView('romantic_profile');
      const ready=()=>picks('type').length&&picks('vibe').length;
      app.innerHTML=`<section class="panel"><p class="eyebrow">${L().typeEye}</p><h2 class="question">${L().typeH}<span class="period">?</span></h2><p class="hint">${L().many}</p><div class="split" style="margin-top:22px">${multiChips(L().typeQ,'type',LI().types,true)}${multiChips(L().vibeQ,'vibe',LI().vibes)}</div><button class="next" id="profile-next" type="button" ${ready()?'':'disabled'}>${L().next}</button></section>`;
      const next=document.getElementById('profile-next');
      bindMulti(()=>{next.disabled=!ready()});
      next.addEventListener('click',()=>{track('attraction_answered',{type:picks('type'),vibe:picks('vibe')});go('match')});
    }

    function renderMatch(){
      trackView('match');
      const a=state.answers;const ready=()=>a.height&&a.build&&picks('match').length;
      const group=(label,key,values,first)=>`<div><p class="section-label"${first?' style="margin-top:0"':''}>${label}</p><div class="compact-options three">${values.map(v=>`<button class="mini${a[key]===v?' selected':''}" type="button" data-profile="${key}" data-value="${escapeHtml(v)}">${escapeHtml(v).replace(' cm','&nbsp;cm')}</button>`).join('')}</div></div>`;
      app.innerHTML=`<section class="panel"><p class="eyebrow">${L().matchEye}</p><h2 class="question">${L().matchH}<span class="period">?</span></h2><div class="split">${group(L().heightQ,'height',LI().heights,true)}${group(L().buildQ,'build',LI().builds)}${multiChips(L().persQ,'match',LI().matches)}</div><button class="next" id="match-next" type="button" ${ready()?'':'disabled'}>${L().next}</button></section>`;
      const next=document.getElementById('match-next');
      app.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>{a[b.dataset.profile]=b.dataset.value;app.querySelectorAll(`[data-profile="${b.dataset.profile}"]`).forEach(x=>x.classList.toggle('selected',x===b));track('answer_selected',{question:b.dataset.profile,choice:b.dataset.value});sfx('select');next.disabled=!ready()}));
      bindMulti(()=>{next.disabled=!ready()});
      next.addEventListener('click',()=>{track('match_answered',{height:a.height,build:a.build,match:picks('match')});go('interests')});
    }

    function renderDifficulty(){
      trackView('difficulty');
      app.innerHTML=`<section class="panel"><h2 class="question">Was ist dein Vibe<span class="period">?</span></h2><div class="options">${DIFFICULTIES.map(v=>btnChoice(v,'difficulty','romantic-scene','difficulty_selected')).join('')}</div></section>`;
      bindSingleChoices();
    }

    function renderRomanticScene(){
      trackView('romantic_scene');
      app.innerHTML=`<section class="panel"><p class="eyebrow">${L().sceneEye}</p><h2 class="question">${L().sceneH}<span class="period">?</span></h2><p class="hint" style="margin-bottom:18px">${L().many}</p>${multiList('scene',LI().scenes)}<button class="next" id="scene-next" type="button" ${picks('scene').length?'':'disabled'}>${L().next}</button></section>`;
      const next=document.getElementById('scene-next');
      bindMulti(()=>{next.disabled=!picks('scene').length});
      next.addEventListener('click',()=>{track('romantic_scene_selected',{scene:picks('scene')});finishRomantic()});
    }

    function finishRomantic(){
      track('romantic_gate_evaluated',{height:state.answers.height,build:state.answers.build,preferred:isPreferred()});
      if(isPreferred())go('final',{sound:'success'});else{sfx('fail');go('denied',{sound:null})}
    }

    function renderDenied(){
      trackView('denied',{path:'romantic'});
      app.innerHTML=`<section class="panel final"><p class="eyebrow danger">${L().deniedEye}</p><h1>${L().deniedH}<span class="period">.</span></h1><p class="lede">${L().deniedLede}</p><button class="appeal" id="appeal" type="button">${L().appeal}</button></section>`;
      document.getElementById('appeal').addEventListener('click',()=>{state.appealed=true;track('appeal_clicked',{path:'romantic'});sfx('unlock');go('exception',{sound:null})});
    }

    function renderException(){
      trackView('exception',{path:'romantic'});
      app.innerHTML=`<section class="panel final"><p class="eyebrow">${L().excEye}</p><h1>${L().excH}<span class="period">.</span></h1><p class="lede">${L().excLede}</p><button class="next" id="exception-next" type="button">${L().next}</button></section>`;
      document.getElementById('exception-next').addEventListener('click',()=>go('final',{sound:'success'}));
    }

    function renderQuest(){
      trackView('quest',{identity:state.answers.identity});
      app.innerHTML=`<section class="panel"><p class="eyebrow">${L().questEye}</p><h2 class="question">${L().questH}<span class="period">?</span></h2><p class="hint" style="margin-bottom:18px">${L().many}</p>${multiList('quest',LI().quests)}<button class="next" id="quest-next" type="button" ${picks('quest').length?'':'disabled'}>${L().next}</button></section>`;
      const next=document.getElementById('quest-next');
      bindMulti(()=>{next.disabled=!picks('quest').length});
      next.addEventListener('click',()=>{track('quest_selected',{quest:picks('quest'),path:'quest'});go('current')});
    }

    function renderTextStep(key,eyebrow,title,placeholder,next,event){
      trackView(key,{path:state.answers.path});
      const a=state.answers;
      app.innerHTML=`<section class="panel"><p class="eyebrow">${eyebrow}</p><h2 class="question">${title}<span class="period">?</span></h2><input class="field" id="text-step" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(a[key])}" /><p class="counter" id="text-count">${a[key].length} / 120</p><button class="next" id="text-next" type="button" ${compact(a[key])?'':'disabled'}>${L().next}</button></section>`;
      const input=document.getElementById('text-step');const count=document.getElementById('text-count');const btn=document.getElementById('text-next');
      const done=()=>{const value=compact(input.value);if(!value)return;a[key]=value;track(event,{value,length:value.length});go(next,next==='final'?{sound:'success'}:{})};
      input.addEventListener('input',()=>{count.textContent=`${input.value.length} / 120`;btn.disabled=!compact(input.value)});
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done()}});
      btn.addEventListener('click',done);
    }
    function renderCurrent(){renderTextStep('current',L().curEye,L().curH,L().curPh,isRomantic()?'romantic-scene':'side','current_quest_completed')}
    function renderSide(){renderTextStep('side',L().sideEye,L().sideH,L().sidePh,'formation','side_quest_completed')}
    function renderFormation(){renderTextStep('formation',L().formEye,L().formH,L().formPh,'final','formation_named')}

    function travelerLine(){const a=state.answers;return (a.identity==='She'?L().she:L().he)+(a.identity==='She'&&a.path?` · ${a.path==='romantic'?L().rRom:L().rQuest}`:'')}
    function summaryRows(){
      const a=state.answers;const rows=[[L().rTraveler,travelerLine()]];
      if(a.age)rows.push([L().rAge,a.age]);
      if(a.city)rows.push([L().rCity,a.city]);
      if(a.talent)rows.push([L().rTalent,a.talent]);
      if(isRomantic()){
        rows.push([L().rType,pickText('type')]);
        rows.push([L().rEvening,pickText('vibe')]);
        rows.push([L().rInto,[a.height,a.build,pickText('match')].filter(Boolean).join(' · ')]);
        if(allInterests().length)rows.push([L().rInterests,allInterests().join(', ')]);
        if(a.current)rows.push([L().rCurrent,a.current]);
        if(picks('scene').length)rows.push([L().rStart,pickText('scene')]);
      } else {
        if(allInterests().length)rows.push([L().rInterests,allInterests().join(', ')]);
        if(a.trick)rows.push([L().rTrick,a.trick]);
        if(a.moral)rows.push([L().rValues,a.moral]);
        if(picks('quest').length)rows.push([L().rAdventure,pickText('quest')]);
        if(a.current)rows.push([L().rCurrent,a.current]);
        if(a.side)rows.push([L().rSide,a.side]);
        if(a.formation)rows.push([L().rFormation,a.formation]);
      }
      return rows;
    }
    function messageText(){
      const lines=[L().msgHello,'',...summaryRows().map(([k,v])=>`${k}: ${v}`)];
      if(isRomantic()&&state.appealed)lines.push(L().msgAppeal);
      return lines.join('\n');
    }
    function whatsappUrl(){return `https://wa.me/${PHONE}?text=${encodeURIComponent(messageText())}`}
    function completeSurvey(){const a=state.answers;track('character_completed',{identity:a.identity,path:a.path,stats:a.stats,build_class:className(),interests:allInterests(),talent:a.talent,trick:a.trick,moral:a.moral,height:a.height,build:a.build,type:picks('type'),vibe:picks('vibe'),match:picks('match'),difficulty:a.difficulty,scene:picks('scene'),quest:picks('quest'),current:a.current,side:a.side,formation:a.formation,appealed:state.appealed})}

    function renderFinal(){
      trackView('final',{path:state.answers.path,identity:state.answers.identity});completeSurvey();
      const rows=`<div class="result-card">${summaryRows().map(([k,v])=>`<div class="result-row"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('')}</div>`;
      if(isRomantic()){
        app.innerHTML=`<section class="panel final"><h1>${L().romFinalH}<span class="period">.</span></h1>${rows}<a class="whatsapp" id="join" href="${whatsappUrl()}">${L().romFinalBtn}</a><p class="micro">${L().micro}</p></section>`;
        document.getElementById('join').addEventListener('click',()=>track('romantic_contact_clicked',{path:'romantic',scene:picks('scene')}));
      }else{
        app.innerHTML=`<section class="panel final"><p class="eyebrow">${L().questFinalEye}</p><h1>${L().questFinalH}<span class="period">.</span></h1><p class="lede">${L().questFinalLede}</p>${rows}<a class="whatsapp" id="join" href="${whatsappUrl()}">${L().questFinalBtn}</a><p class="micro">${L().micro}</p></section>`;
        document.getElementById('join').addEventListener('click',()=>track('join_party_clicked',{path:'quest',quest:picks('quest')}));
      }
    }

    function bindSingleChoices(){
      app.querySelectorAll('[data-single-key]').forEach(b=>b.addEventListener('click',()=>chooseSingle(b.dataset.singleKey,b.dataset.value,b.dataset.next,b.dataset.event)));
    }

    function render(){
      updateHud();
      if(state.screen==='identity')renderIdentity();
      else if(state.screen==='path')renderPath();
      else if(state.screen==='about')renderAbout();
      else if(state.screen==='talent')renderTalent();
      else if(state.screen==='stats')renderStats();
      else if(state.screen==='interests')renderInterests();
      else if(state.screen==='story')renderStory();
      else if(state.screen==='trick')renderTrick();
      else if(state.screen==='values')renderValues();
      else if(state.screen==='romantic-profile')renderRomanticProfile();
      else if(state.screen==='match')renderMatch();
      else if(state.screen==='difficulty')renderDifficulty();
      else if(state.screen==='romantic-scene')renderRomanticScene();
      else if(state.screen==='denied')renderDenied();
      else if(state.screen==='exception')renderException();
      else if(state.screen==='quest')renderQuest();
      else if(state.screen==='current')renderCurrent();
      else if(state.screen==='side')renderSide();
      else if(state.screen==='formation')renderFormation();
      else if(state.screen==='final')renderFinal();
    }

    back.addEventListener('click',()=>{if(!state.history.length)return;let prev=state.history.pop();while(['denied','exception'].includes(prev)&&state.history.length){state.appealed=false;prev=state.history.pop()}track('back_clicked',{from:state.screen,to:prev});state.screen=prev;analytics.lastView='';sfx('select');render()});
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
    sfxEl.addEventListener('click',()=>{state.sound=!state.sound;if(state.sound)sfx('unlock');track('sfx_toggled',{enabled:state.sound});updateHud()});

    track('game_started',{referrer:document.referrer?(()=>{try{return new URL(document.referrer).hostname}catch{return 'unknown'}})():'direct'});
    render();
  })();
  </script>
</body>
</html>
